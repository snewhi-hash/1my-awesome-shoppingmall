<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사과 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB, #98D8E8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E8F4F8 100%);
            border: 4px solid #4682B4;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #gameInfo {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        #basket {
            position: absolute;
            bottom: 20px;
            width: 160px;
            height: 80px;
            background: linear-gradient(to bottom, #D2691E 0%, #8B4513 50%, #654321 100%);
            border-radius: 0 0 20px 20px;
            border: 4px solid #4A2511;
            transition: left 0.1s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), inset 0 -5px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        #basket::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -8px;
            right: -8px;
            height: 20px;
            background: linear-gradient(to right, #CD853F, #D2691E, #CD853F);
            border-radius: 15px 15px 0 0;
            border: 4px solid #4A2511;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.3);
        }

        #basket::after {
            content: '🧺';
            position: absolute;
            font-size: 80px;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
        }

        .apple {
            position: absolute;
            width: 40px;
            height: 40px;
            font-size: 40px;
            transition: top 0.05s linear;
        }

        #startScreen,
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }

        #startScreen h1,
        #gameOverScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        #startScreen p,
        #gameOverScreen p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #finalScore {
            font-size: 32px;
            color: #FFD700;
            margin: 20px 0;
        }

        .hidden {
            display: none !important;
        }

        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, #90EE90 0%, #228B22 100%);
            z-index: 1;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="gameInfo">
            <div>점수: <span id="score">0</span></div>
            <div>생명: <span id="lives">❤️❤️❤️</span></div>
        </div>

        <div id="ground"></div>
        <div id="basket"></div>

        <div id="startScreen">
            <h1>🍎 사과 게임 🍎</h1>
            <p>← → 키로 바구니를 움직여 사과를 받으세요!</p>
            <p>사과를 놓치면 생명이 감소합니다.</p>
            <button onclick="startGame()">게임 시작</button>
        </div>

        <div id="gameOverScreen" class="hidden">
            <h1>게임 오버!</h1>
            <div id="finalScore"></div>
            <button onclick="restartGame()">다시 시작</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const basket = document.getElementById('basket');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');

        let basketPosition = 320;
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let apples = [];
        let appleSpeed = 2;
        let spawnInterval = 1500;
        let gameLoop;
        let spawnTimer;
        let basketWidth = 160;

        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function startGame() {
            startScreen.classList.add('hidden');
            score = 0;
            lives = 3;
            appleSpeed = 2;
            spawnInterval = 1500;
            basketPosition = 320;
            apples = [];
            gameRunning = true;

            updateScore();
            updateLives();
            updateBasketPosition();

            gameLoop = setInterval(updateGame, 20);
            spawnApples();
        }

        function restartGame() {
            gameOverScreen.classList.add('hidden');
            // 남은 사과 제거
            apples.forEach(apple => {
                if (apple.element.parentNode) {
                    gameContainer.removeChild(apple.element);
                }
            });
            startGame();
        }

        function spawnApples() {
            if (!gameRunning) return;

            const apple = document.createElement('div');
            apple.className = 'apple';
            apple.textContent = '🍎';
            apple.style.left = Math.random() * (gameContainer.offsetWidth - 40) + 'px';
            apple.style.top = '-40px';
            gameContainer.appendChild(apple);

            apples.push({
                element: apple,
                y: -40,
                x: parseFloat(apple.style.left)
            });

            spawnTimer = setTimeout(spawnApples, spawnInterval);
        }

        function updateGame() {
            if (!gameRunning) return;

            // 바구니 움직이기
            if (keys['ArrowLeft'] && basketPosition > 0) {
                basketPosition -= 7;
            }
            if (keys['ArrowRight'] && basketPosition < gameContainer.offsetWidth - basketWidth) {
                basketPosition += 7;
            }
            updateBasketPosition();

            // 사과 움직이기
            for (let i = apples.length - 1; i >= 0; i--) {
                const apple = apples[i];
                apple.y += appleSpeed;
                apple.element.style.top = apple.y + 'px';

                // 바구니와 충돌 체크
                const basketTop = gameContainer.offsetHeight - 100;
                if (apple.y >= basketTop && apple.y <= basketTop + 30) {
                    if (apple.x >= basketPosition - 10 && apple.x <= basketPosition + basketWidth - 10) {
                        // 사과를 잡았습니다!
                        score += 10;
                        updateScore();
                        gameContainer.removeChild(apple.element);
                        apples.splice(i, 1);

                        // 난이도 증가
                        if (score % 100 === 0) {
                            appleSpeed += 0.5;
                            spawnInterval = Math.max(800, spawnInterval - 100);
                        }
                        continue;
                    }
                }

                // 화면 밖으로 나간 경우
                if (apple.y > gameContainer.offsetHeight) {
                    lives--;
                    updateLives();
                    gameContainer.removeChild(apple.element);
                    apples.splice(i, 1);

                    if (lives <= 0) {
                        endGame();
                    }
                }
            }
        }

        function updateBasketPosition() {
            basket.style.left = basketPosition + 'px';
        }

        function updateScore() {
            scoreElement.textContent = score;
        }

        function updateLives() {
            const hearts = '❤️'.repeat(lives);
            livesElement.textContent = hearts || '💀';
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            clearTimeout(spawnTimer);

            finalScoreElement.textContent = `최종 점수: ${score}점`;
            gameOverScreen.classList.remove('hidden');
        }
    </script>
</body>

</html>
