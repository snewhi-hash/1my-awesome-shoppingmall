<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #0f0f0f;
            color: #fff;
        }

        /* 헤더 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background-color: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
        }

        .menu-icon:hover {
            background-color: #272727;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: #ff0000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-center {
            flex: 1;
            max-width: 640px;
            margin: 0 40px;
            display: flex;
            align-items: center;
        }

        .search-container {
            display: flex;
            width: 100%;
        }

        .search-input {
            flex: 1;
            height: 40px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            padding: 0 16px;
            color: #fff;
            font-size: 16px;
        }

        .search-input:focus {
            outline: none;
            border-color: #1c62b9;
        }

        .search-button {
            width: 64px;
            height: 40px;
            background-color: #222222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-button:hover {
            background-color: #333;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
        }

        .icon-button:hover {
            background-color: #272727;
        }

        /* 배너 */
        .channel-banner {
            margin-top: 56px;
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .channel-info {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            background-color: #0f0f0f;
        }

        .channel-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .channel-details h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .channel-stats {
            color: #aaa;
            font-size: 14px;
        }

        .subscribe-button {
            margin-left: auto;
            background-color: #cc0000;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .subscribe-button:hover {
            background-color: #b00000;
        }

        /* 탭 네비게이션 */
        .tabs {
            display: flex;
            gap: 32px;
            padding: 0 24px;
            border-bottom: 1px solid #333;
            margin-bottom: 24px;
        }

        .tab {
            padding: 14px 0;
            cursor: pointer;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .tab:hover {
            color: #fff;
        }

        /* 비디오 그리드 */
        .videos-container {
            padding: 0 24px 24px;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            max-width: 2000px;
            margin: 0 auto;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .video-card:hover {
            transform: scale(1.02);
        }

        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #222;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 3px 4px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .video-info {
            display: flex;
            gap: 12px;
            padding: 12px 0;
        }

        .video-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #ff0000;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .video-details {
            flex: 1;
        }

        .video-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 4px;
            color: #fff;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .video-channel {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 2px;
        }

        .video-metadata {
            font-size: 12px;
            color: #aaa;
        }

        @media (max-width: 768px) {
            .videos-grid {
                grid-template-columns: 1fr;
            }

            .header-center {
                margin: 0 16px;
            }
        }
    </style>
</head>
