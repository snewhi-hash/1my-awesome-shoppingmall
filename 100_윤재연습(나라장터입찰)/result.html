<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나라장터 개찰결과 - 조회 결과</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
        }
        .info-item {
            display: inline-block;
            margin: 5px 15px;
            font-size: 14px;
        }
        .info-item strong { color: #667eea; }
        .results { padding: 25px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .stat-card .label { font-size: 14px; opacity: 0.9; }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 13px;
        }
        .result-table thead {
            background: #667eea;
            color: white;
        }
        .result-table th {
            padding: 12px 10px;
            text-align: left;
            font-weight: bold;
            font-size: 13px;
        }
        .result-table td {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            font-size: 12px;
        }
        .result-table tbody tr:hover { background: #f8f9fa; }
        .result-table tbody tr:nth-child(even) { background: #f8f9fa; }
        .no-data {
            text-align: center;
            padding: 60px;
            color: #6c757d;
            font-size: 18px;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
        }
        .btn-reload {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 20px auto;
            display: block;
        }
        .btn-reload:hover { background: #5568d3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 나라장터 개찰결과 조회</h1>
            <p>업종코드: 전체 | 용역 계약</p>
        </div>
        <div class="info-box">

            <div class="info-item"><strong>조회기간:</strong> 2025-01-01 ~ 2025-01-31</div>
            <div class="info-item"><strong>업종코드:</strong> 전체</div>
            <div class="info-item"><strong>조회시간:</strong> 2026-02-05 15:11:25</div>
        </div>
        <div class="results">

            <div class="error">
                <h3>❌ API 호출 실패</h3>
                <p>API 호출 중 오류가 발생했습니다. API 키와 파라미터를 확인해주세요.</p>
            </div>
        
        </div>
    </div>
</body>
</html>
